name: Python API CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd apps/python-fast
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          cd apps/python-fast
          ruff check app tests

      - name: Test
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+pysqlite:///:memory:
          JWT_SECRET: ci-test-secret
        run: |
          cd apps/python-fast
          pytest -q
